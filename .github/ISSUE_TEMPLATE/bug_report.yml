name: Completion bug
description: Report a reproducible completion issue.
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the editor, source/live mode, model and actions. Use synthetic text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Describe the difference.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions and platform
      description: Obsidian, YOLO Completion Only, editor plugin versions and OS.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Optional diagnostics
      description: Relevant errors only. Do not paste API keys, data.json or private notes.
    validations:
      required: false
