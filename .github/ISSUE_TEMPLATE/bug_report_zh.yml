name: 补全问题
description: 报告可复现的补全问题。
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请说明编辑器、源码／可视模式、模型以及操作步骤；使用合成文本。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
      description: 描述差异。
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: 版本与平台
      description: Obsidian、YOLO Completion Only、编辑器插件版本和操作系统。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 可选诊断
      description: 仅附相关错误；不要粘贴 API 密钥、data.json 或私人笔记。
    validations:
      required: false
